<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Aggressively suppress external extension errors (Tonkeeper)
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('destroyTonkeeper')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true); // Capture phase

      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.toString().includes('destroyTonkeeper')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true); // Capture phase
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether Rift: Tactical Clash 3D</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
